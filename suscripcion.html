    <main class="contenido-principal container my-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h1 class="mb-3">Suscripcion</h1>
                <p>Llena tus datos para avisarte cuando subamos cosas nuevas (Nunca subire nada mas)</p>
                
                <form class="card p-4">
                    <div class="mb-3">
                        <label for="cajaNombre" class="form-label">Nombre completo papu</label>
                        <input type="text" class="form-control" id="cajaNombre" placeholder="Tu nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="cajaCorreo" class="form-label">Correo electronico</label>
                        <input type="email" class="form-control" id="cajaCorreo" placeholder="correo@ejemplo.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="cajaTelefono" class="form-label">Telefono (si quieres)</label>
                        <input type="tel" class="form-control" id="cajaTelefono" placeholder="899-123-4567">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="casillaAcepto" required>
                        <label class="form-check-label" for="casillaAcepto">Quiero recibir notificaciones(No le piques)</label>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Suscribirme</button>
                </form>
            </div>
        </div>
    </main>
    <footer class="pie-pagina bg-dark text-white text-center py-3 mt-5">
